# GoReleaser configuration for switchAILocal
# Documentation: https://goreleaser.com
#
# NOTE: This project requires CGO (onnxruntime_go) so we use a matrix
# release workflow that builds natively on each OS. GoReleaser runs
# in --split mode per-OS, then the release job combines all artifacts.

version: 2

project_name: switchAILocal

before:
  hooks:
    - go mod tidy

builds:
  - id: switchAILocal
    main: ./cmd/server
    binary: switchAILocal
    env:
      - CGO_ENABLED=1
    goos:
      - "{{ .Env.GOOS }}"
    goarch:
      - "{{ .Env.GOARCH }}"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: bridge-agent
    main: ./cmd/bridge-agent
    binary: bridge-agent
    env:
      - CGO_ENABLED=0
    goos:
      - "{{ .Env.GOOS }}"
    goarch:
      - "{{ .Env.GOARCH }}"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - config.example.yaml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: traylinx
    name: switchAILocal
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} v{{ .Version }}"
