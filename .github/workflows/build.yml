name: Build & Push to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
      push:
        description: Publish immutable candidate image (not a channel promotion)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  security-gate:
    uses: ./.github/workflows/go-vulnerability-gate.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
  build:
    needs: security-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.security-gate.outputs.source_commit }}
          fetch-depth: 0
      - name: Resolve checked-out identity
        id: source
        env:
          SCANNED_SHA: ${{ needs.security-gate.outputs.source_commit }}
        run: |
          SHA=$(git rev-parse HEAD)
          test "$SHA" = "$SCANNED_SHA"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          IMAGE=ghcr.io/traylinx/switchailocal
          echo "tags<<TAGS" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:sha-${SHA}" >> "$GITHUB_OUTPUT"
          VERSION=dev
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            VERSION="${TAG#v}"
            echo "${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          fi
          echo "TAGS" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'workflow_dispatch' || inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate (never promotes a channel)
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          platforms: ${{ github.event_name == 'workflow_dispatch' && !inputs.push && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.source.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=https://github.com/traylinx/switchAILocal
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            COMMIT=${{ steps.source.outputs.sha }}
            BUILD_DATE=${{ steps.source.outputs.date }}
          load: ${{ github.event_name == 'workflow_dispatch' && !inputs.push }}
      - name: Record candidate identity
        if: steps.image.outputs.digest != ''
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          printf 'Candidate: ghcr.io/traylinx/switchailocal@%s\nSource: %s\nNo channel promotion or deployment.\n' "$DIGEST" "$SHA" >> "$GITHUB_STEP_SUMMARY"
