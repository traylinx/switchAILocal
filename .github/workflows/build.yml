name: Build & Push to GHCR

on:
  push:
    branches: [main]
    # Also fire on version tags — release:published is unreliable when the
    # release is created by another workflow (action-gh-release in release.yml)
    # so we trigger directly off the tag ref. Covers semver tags like v0.3.0.
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch/tag/SHA). Defaults to the ref gh workflow run was invoked with.'
        required: false
      push:
        description: 'Push the built image to GHCR (default false for safe local/test builds)'
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/switchailocal

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=stable,enable=${{ github.event_name == 'release' }}
            type=ref,event=branch
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          platforms: ${{ github.event_name == 'workflow_dispatch' && !inputs.push && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          load: ${{ github.event_name == 'workflow_dispatch' }}
