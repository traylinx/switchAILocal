name: Build & Push to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
      push:
        description: Publish immutable candidate image (not a channel promotion)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  security-gate:
    uses: ./.github/workflows/go-vulnerability-gate.yml
    with:
      ref: ${{ inputs.ref || github.ref }}
  build:
    needs: security-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.security-gate.outputs.source_commit }}
          fetch-depth: 0
      - name: Resolve checked-out identity
        id: source
        env:
          SCANNED_SHA: ${{ needs.security-gate.outputs.source_commit }}
        run: |
          SHA=$(git rev-parse HEAD)
          test "$SHA" = "$SCANNED_SHA"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          IMAGE=ghcr.io/traylinx/switchailocal
          echo "tags<<TAGS" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:sha-${SHA}" >> "$GITHUB_OUTPUT"
          VERSION=dev
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            VERSION="${TAG#v}"
            echo "${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          fi
          echo "TAGS" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'workflow_dispatch' || inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate (never promotes a channel)
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ (github.event_name != 'workflow_dispatch' || inputs.push) && 'type=image,name=ghcr.io/traylinx/switchailocal,push-by-digest=true,name-canonical=true,push=true' || '' }}
          cache-from: type=gha,scope=ail-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ail-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.source=https://github.com/traylinx/switchAILocal
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
          build-args: |
            VERSION=${{ steps.source.outputs.version }}
            COMMIT=${{ steps.source.outputs.sha }}
            BUILD_DATE=${{ steps.source.outputs.date }}
          load: ${{ github.event_name == 'workflow_dispatch' && !inputs.push }}
      - name: Native image startup smoke
        if: github.event_name != 'workflow_dispatch' || inputs.push
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: timeout 60 docker run --rm --network none "ghcr.io/traylinx/switchailocal@${DIGEST}" --help
      - name: Record native candidate
        if: github.event_name != 'workflow_dispatch' || inputs.push
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.source.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p native-metadata
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          record = dict(digest=os.environ['DIGEST'], source=os.environ['SHA'], version=os.environ['VERSION'], arch=os.environ['ARCH'])
          Path('native-metadata/' + record['arch'] + '.json').write_text(json.dumps(record))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch' || inputs.push
        with:
          name: native-${{ matrix.arch }}
          path: native-metadata/*.json
          retention-days: 7

  publish-index:
    if: github.event_name != 'workflow_dispatch' || inputs.push
    needs: [security-gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.security-gate.outputs.source_commit }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: native-metadata
          merge-multiple: true
      - name: Verify matching native metadata and publish index
        env:
          SCANNED_SHA: ${{ needs.security-gate.outputs.source_commit }}
        run: python3 deploy/release/publish_index.py --metadata native-metadata --source "$SCANNED_SHA"
