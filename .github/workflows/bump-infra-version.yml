# Bump infra version on tag push
#
# When a release tag like v0.3.0 lands on this repo, update
# traylinx/wannolot-infrastructure/switchailocal-version.txt on main.
# That commit is the fleet rollout trigger: each Tytus droplet's GitOps
# timer pulls infrastructure main, rewrites AIL_IMAGE, re-renders compose,
# and rolls switchAILocal with per-instance health checks.
#
# Required secret: INFRA_REPO_PAT
#   - Fine-grained PAT with contents:write on traylinx/wannolot-infrastructure.
#     NOT the default GITHUB_TOKEN, which cannot write to another repo.
#
# If the secret is missing, this job exits cleanly because current Tytus
# infrastructure also polls latest switchAILocal releases fleet-side. The PAT
# path remains a fast explicit pin when available.

name: Bump infra version

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  bump:
    name: Auto-pin infrastructure repo
    runs-on: ubuntu-latest
    steps:
      - name: Extract tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version_no_prefix=${TAG#v}" >> "${GITHUB_OUTPUT}"
          echo "Released: ${TAG}"

      - name: Check infra PAT
        id: gate
        env:
          PAT: ${{ secrets.INFRA_REPO_PAT }}
        run: |
          if [ -z "${PAT:-}" ]; then
            echo "INFRA_REPO_PAT secret not set — skipping cross-repo pin push."
            echo "Tytus droplets still auto-update from the public latest release via wannolot-infrastructure GitOps."
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout infrastructure repo
        if: steps.gate.outputs.has_pat == 'true'
        uses: actions/checkout@v4
        with:
          repository: traylinx/wannolot-infrastructure
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra
          # Full history so we can see the prior pin in the commit log.
          fetch-depth: 0

      - name: Bump switchailocal-version.txt
        if: steps.gate.outputs.has_pat == 'true'
        id: bump
        working-directory: infra
        run: |
          PIN_FILE="switchailocal-version.txt"
          NEW_TAG="${{ steps.tag.outputs.tag }}"

          if [ ! -f "${PIN_FILE}" ]; then
            echo "${PIN_FILE} missing in infra repo — creating fresh"
            OLD_TAG=""
          else
            OLD_TAG="$(tr -d '[:space:]' < "${PIN_FILE}")"
          fi

          if [ "${OLD_TAG}" = "${NEW_TAG}" ]; then
            echo "Pin already at ${NEW_TAG} — nothing to do."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "${NEW_TAG}" > "${PIN_FILE}"
          echo "old_tag=${OLD_TAG}" >> "${GITHUB_OUTPUT}"
          echo "new_tag=${NEW_TAG}" >> "${GITHUB_OUTPUT}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "Bumped ${PIN_FILE}: ${OLD_TAG:-<unset>} → ${NEW_TAG}"

      - name: Commit and push infrastructure pin
        if: steps.gate.outputs.has_pat == 'true' && steps.bump.outputs.skip != 'true'
        working-directory: infra
        run: |
          git config user.name "switchAILocal release bot"
          git config user.email "actions@github.com"
          git add switchailocal-version.txt
          git commit -m "chore(switchailocal): pin to ${{ steps.tag.outputs.tag }}" \
            -m "Released: https://github.com/traylinx/switchAILocal/releases/tag/${{ steps.tag.outputs.tag }}"
          git push origin HEAD:main

          echo "Pinned Tytus fleet switchAILocal image: ${{ steps.bump.outputs.old_tag }} → ${{ steps.bump.outputs.new_tag }}"
          echo "Droplets converge via wannolot-gitops.timer within one tick."
