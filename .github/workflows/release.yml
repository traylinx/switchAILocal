# Release Workflow
# Triggered on version tags (v*)
# Builds CGO-enabled binaries natively on each platform via matrix,
# then creates a single GitHub Release with all artifacts.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Re-publish an existing release to npm only (no build, no GitHub Release).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm (e.g. v0.6.4)
        required: true

permissions:
  contents: write
  packages: write

jobs:
  security-gate:
    if: github.event_name == 'push'
    uses: ./.github/workflows/go-vulnerability-gate.yml
  build:
    needs: security-gate
    if: github.event_name == 'push'
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: arm64
            runner: macos-15
          # darwin/amd64 intentionally omitted.
          # GitHub's macos-13 Intel runners are heavily queue-limited — v0.1.0
          # and v0.2.0 both had the darwin/amd64 matrix entry stuck "queued" for
          # 30+ minutes, blocking the whole release. Intel Mac users build from
          # source with: git clone && CGO_ENABLED=1 go build ./cmd/server/
          # (onnxruntime for darwin/amd64 must be installed separately; see
          # scripts/download-embedding-model.sh for the ARM equivalent).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.security-gate.outputs.source_commit }}

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: true

      - name: Verify scanned checkout
        env:
          SCANNED_SHA: ${{ needs.security-gate.outputs.source_commit }}
        run: test "$(git rev-parse HEAD)" = "$SCANNED_SHA"

      - name: Install Linux build deps
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="$(git rev-parse HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${DATE}"

          OUTDIR="switchAILocal_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "${OUTDIR}"

          echo "Building switchAILocal ${GOOS}/${GOARCH}..."
          CGO_ENABLED=1 go build -ldflags="${LDFLAGS}" -o "${OUTDIR}/switchAILocal" ./cmd/server/

          echo "Building bridge-agent ${GOOS}/${GOARCH}..."
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${VERSION}" -o "${OUTDIR}/bridge-agent" ./cmd/bridge-agent/

          cp README.md LICENSE config.example.yaml "${OUTDIR}/"
          cp -R deploy/managed-server "${OUTDIR}/managed-server"
          [ -f CHANGELOG.md ] && cp CHANGELOG.md "${OUTDIR}/"

          tar czf "${OUTDIR}.tar.gz" "${OUTDIR}/"
          if command -v sha256sum &>/dev/null; then
            sha256sum "${OUTDIR}.tar.gz" > "${OUTDIR}.tar.gz.sha256"
          else
            shasum -a 256 "${OUTDIR}.tar.gz" > "${OUTDIR}.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            switchAILocal_*.tar.gz
            switchAILocal_*.tar.gz.sha256

  release:
    name: Create Release
    if: github.event_name == 'push'
    needs: [build, security-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.security-gate.outputs.source_commit }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cat *.sha256 > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            switchAILocal_*.tar.gz
            checksums.txt

  publish-npm:
    name: Publish npm package
    needs: [release, security-gate]
    # Runs after a tag release, or alone from workflow_dispatch for an existing tag.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    # npm trusted publishing: the registry trusts this workflow file
    # (traylinx/switchAILocal, release.yml) through GitHub OIDC. No npm token
    # is stored; provenance is attached automatically.
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || needs.security-gate.outputs.source_commit }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@11 && npm --version

      - name: Sync package.json version to tag
        working-directory: npx/switchailocal
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          echo "Syncing package.json to ${TAG_VERSION}"
          jq --arg v "${TAG_VERSION}" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          cat package.json

      - name: Check if version already published
        id: check
        working-directory: npx/switchailocal
        run: |
          PKG_NAME=$(jq -r .name package.json)
          PKG_VERSION=$(jq -r .version package.json)
          if npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${PKG_NAME}@${PKG_VERSION} already published — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Will publish ${PKG_NAME}@${PKG_VERSION}"
          fi

      # A failure here fails the job (the GitHub Release already exists). It
      # used to be ignored, which hid an expired token for seven months.
      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        working-directory: npx/switchailocal
        run: npm publish --access public
