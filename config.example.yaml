###############################################################################
# switchAILocal - Configuration Golden Reference
#
# This file serves as a comprehensive example of all available settings.
# Copy this to 'config.yaml' and customize it for your needs.
###############################################################################

# =============================================================================
# 1. SERVER SETTINGS
# =============================================================================

# Server host/interface to bind to.
# Default is empty ("") to bind all interfaces (IPv4 + IPv6).
# Use "127.0.0.1" or "localhost" to restrict access to local machine only.
host: ""

# Server port (default: 18080)
port: 18080

# TLS settings for HTTPS. When enabled, the server listens with the provided certificate and key.
tls:
  enable: false
  cert: ""
  key: ""

# Stable public aliases. Provider/native model names are implementation details.
# Virtual-model strategy uses smooth weighted round-robin per request class:
#   weight 1 + 1 => A, B, A, B (50/50 over complete cycles)
#   weight 3 + 2 => A, B, A, B, A (60/40 over five-request cycles)
# `provider` is a lower-case opaque backend ID. It can represent a vendor,
# subscription, local runtime, or proxy plugin as long as a matching provider is
# configured.
virtual-models:
  ail-compound:
    description: "Universal default assistant; capability-filtered pool"
    expose: true
    strategy: weighted-round-robin
    fallback: true
    response_model: requested
    members:
      - id: compound-minimax-m3
        provider: minimax
        model: MiniMax-M3
        enabled: true
        weight: 1
        capabilities:
          operations: [chat, chat_text_tools, chat_multiturn_tools, chat_image_understanding]
          input: [text, image]
          output: [text]
          tools: true
          tool_history_replay: true
          agentic_safe: true
          context: 1000000
          proof_required_for: [audio]
      - id: compound-alibaba-glm52
        provider: alibaba
        model: glm-5.2
        enabled: true
        weight: 1
        capabilities:
          operations: [chat, chat_text_tools, chat_multiturn_tools]
          input: [text]
          output: [text]
          tools: true
          tool_history_replay: true
          agentic_safe: true
          context: 1000000
      - id: compound-deepseek-v4_pro
        provider: deepseek
        model: deepseek-v4-pro
        enabled: false
        weight: 1
        capabilities:
          operations: [chat, chat_text_tools]
          input: [text]
          output: [text]
          tools: true
          context: 1000000
      - id: compound-kimi-k2_6
        provider: kimi
        model: kimi-k2.6
        enabled: false
        weight: 1
        capabilities:
          operations: [chat]
          input: [text]
          output: [text]
          tools: true
          context: 256000

  # Hidden example pool for operators who want explicit weighted balancing
  # between two backend IDs while preserving one public model name.
  # Keep text-only members out of `chat_multiturn_tools` unless live replay
  # proof exists. The router keeps `chat_text` and `chat_multiturn_tools`
  # scheduler state separate, so capability metadata is the safety boundary.
  #
  # ail-example-weighted:
  #   description: "Example hidden 60/40 text pool"
  #   expose: false
  #   strategy: weighted-round-robin
  #   response_model: requested
  #   members:
  #     - id: subscription-a-text
  #       provider: subscription-a
  #       model: provider-native-model-a
  #       enabled: true
  #       weight: 3
  #       capabilities:
  #         operations: [chat, chat_text_tools]
  #         input: [text]
  #         output: [text]
  #         tools: true
  #     - id: subscription-b-text
  #       provider: subscription-b
  #       model: provider-native-model-b
  #       enabled: true
  #       weight: 2
  #       capabilities:
  #         operations: [chat, chat_text_tools]
  #         input: [text]
  #         output: [text]
  #         tools: true
  #     - id: subscription-a-agentic
  #       provider: subscription-a
  #       model: provider-native-agentic-model
  #       enabled: true
  #       weight: 1
  #       capabilities:
  #         operations: [chat_multiturn_tools]
  #         input: [text]
  #         output: [text]
  #         tools: true
  #         tool_history_replay: true


# Authentication directory (supports ~ for home directory)
# This is where token files and session data are stored.
auth-dir: "~/.switchailocal"

# API keys for authenticating clients to THIS switchAILocal server.
# Requests must include "Authorization: Bearer <key>"
api-keys:
  - "sk-test-123"

# When true, enable authentication for the WebSocket API (/v1/ws).
ws-auth: true

# =============================================================================
# 2. SECURITY & MANAGEMENT
# =============================================================================

# Management API settings (Dashboard and Control endpoints)
remote-management:
  # Whether to allow remote (non-localhost) management access.
  # When false, only localhost can access management endpoints (key still required).
  allow-remote: false

  # Management key. If a plaintext value is provided here, it will be hashed on startup.
  # All management requests (even from localhost) require this key.
  # Leave empty to disable the Management API entirely (404 for all management routes).
  secret-key: ""

  # Disable the bundled management control panel asset download and HTTP route when true.
  disable-control-panel: false

  # GitHub repository for the management control panel assets.
  panel-github-repository: "https://github.com/traylinx/switchAILocal-Management-Center"

# =============================================================================
# 3. CORE PROXY BEHAVIOR
# =============================================================================

# Enable debug-level logging and detailed error messages.
debug: false

# When true, write application logs to rotating files instead of stdout.
logging-to-file: false

# Maximum total size (MB) of log files. Oldest logs are deleted when limit reached.
# Set to 0 to disable limit.
logs-max-total-size-mb: 0

# When false, disable in-memory usage statistics aggregation.
usage-statistics-enabled: false

# Global Proxy URL. Supports socks5/http/https protocols.
# Example: socks5://user:pass@192.168.1.1:1080/
proxy-url: ""

# Number of times to retry a request on specific HTTP errors (403, 408, 500, 502, 503, 504).
request-retry: 3

# When true, unprefixed model requests only use credentials without a prefix.
# If false, unprefixed requests can match any available credential.
force-model-prefix: false

# Streaming behavior (SSE heartbeats and automatic bootstrap retries)
streaming:
  # Heartbeat interval in seconds. 0 to disable.
  keepalive-seconds: 15
  # Number of retries before the first byte is sent to handle auth rotation.
  bootstrap-retries: 2

# Performance & reliability tuning (circuit breaker, timeouts, stall detection, etc.)
performance:
  circuit-breaker:
    enabled: true
    failure-threshold: 3    # consecutive failures before circuit opens (lower = faster failover)
    reset-timeout: 5m       # time in OPEN state before HALF_OPEN probe
    half-open-max: 3        # probe requests allowed in HALF_OPEN
  provider-timeouts:
    # Fallback used when a provider has no explicit entry below.
    default: 120s
    # Per-provider overrides. Commented entries show recommended starting points.
    # per-provider:
    #   openai: 30s
    #   anthropic: 60s
    #   gemini: 45s
    #   ollama: 180s         # local, can be slow on cold start
  streaming:
    # Max time to wait for the first byte. A stall before first-byte is recoverable —
    # we can transparently failover to the next provider.
    first-byte-timeout: 15s
    # Max gap between SSE chunks before we classify the stream as stalled. Post-
    # first-chunk stalls CANNOT be transparently recovered — we terminate with an
    # SSE error event and the client must retry.
    stall-timeout: 60s

# Quota exceeded behavior
quota-exceeded:
  switch-project: true # Move to next project/credential if current quota hit.
  switch-preview-model: true # Fallback to preview models if available.

# =============================================================================
# 4. ROUTING STRATEGY
# =============================================================================

# Routing strategy for selecting credentials when multiple match.
routing:
  # Supported values: "round-robin" (default), "fill-first".
  strategy: "round-robin"

# =============================================================================
# 5. INTELLIGENT AUTO-ROUTING (CORTEX)
# =============================================================================

auto-routing:
  # Enable the intelligent multi-provider routing engine
  enabled: true
  max-resolution-ms: 5ms

  # Weights (must sum to 1.0) defining how models are scored
  weights:
    availability: 0.35
    quota: 0.25
    latency: 0.20
    success-rate: 0.20

  # Soft-steering logic to boost specific models. Prefer primary + backup
  # pairs so the circuit breaker can failover gracefully.
  preferences:
    - model: "ail-compound"
      preference: 0.9
      reason: "stable universal compound"

  # Tier and constraint definition overrides per provider
  providers:
    # ollama:
    #   tier: local
    # claude:
    #   tier: premium

  # Automatic Discovery mapping
  discovery:
    enabled: true
    probe-on-startup: true
    probe-interval: 15m
    probe-timeout: 5s
    passive-monitoring: true
    cache-ttl: 24h

  # Token conservation logic (route simple tasks to cheap tiers instead of premium)
  conservation:
    enabled: true
    simple-threshold-tokens: 500
    premium-conservation-at: 0.20

  # Autonomous Lab (Self-optimizing weights via shadow experiments)
  lab:
    enabled: true
    adaptation-interval: 24h
    max-weight-drift: 0.10

  # Intent-Based Filtering matrix
  # Maps common intents (e.g. coding, fast, reasoning) to allowed model pools
  # intent-matrix:
  #   coding:
  #     - "claude:claude-3-5-sonnet-20241022"
  #     - "gemini:gemini-2.5-pro"

  # Hard blacklist — providers listed here are never selected, even if they score
  # highest. Use when credits are exhausted or a provider is known-bad. Cleared
  # manually; no auto-recovery (by design — prevents silent credit drain).
  # disabled-providers:
  #   - anthropic

# =============================================================================
# 5. PROVIDER CONFIGURATIONS
# =============================================================================

# -- TRAYLINX SwitchAI Cloud --
# Unified access to 100+ cloud models. Get key at https://switchai.traylinx.com
switchai-api-key:
  - api-key: "sk-lf-..."
    base-url: "https://switchai.traylinx.com/v1"
    models:
      - name: "openai/gpt-oss-120b"
        alias: "switchai-fast"
      - name: "deepseek-reasoner"
        alias: "switchai-reasoner"
      - name: "mistral-embed"
        alias: "switchai-embed"

# -- GOOGLE Gemini API --
gemini-api-key:
  - api-key: "AIzaSy..."
    prefix: "google" # Access via "google/gemini-pro"
    base-url: "https://generativelanguage.googleapis.com"

# -- ANTHROPIC Claude API --
claude-api-key:
  - api-key: "sk-ant-..."
    models:
      - name: "claude-3-5-sonnet-20241022"
        alias: "sonnet"

# -- OPENAI / CODEX API --
codex-api-key:
  - api-key: "sk-..."
    base-url: "https://api.openai.com/v1"

# -- OLLAMA (Local) --
# Start with: ollama serve
ollama:
  enabled: true
  base-url: "http://localhost:11434"
  auto-discover: true # Fetch models from Ollama automatically

# -- OPENCODE (Local) --
opencode:
  enabled: true
  base-url: "http://localhost:4096"
  default-agent: "build"

# -- LM STUDIO (Local) --
lmstudio:
  enabled: false
  base-url: "http://localhost:1234/v1"
  auto-discover: true

# -- OPENAI COMPATIBILITY (Groq, OpenRouter, Alibaba, etc.) --
# Custom providers automatically receive standard OpenAI formatting.
# 
# TIP: If your HTTP client strictly requires legacy prefixes (e.g., "alibaba:qwen-plus"),
# use the `alias:` field under `models` to map that exact string to the upstream model!
openai-compatibility:
  - name: "groq"
    prefix: "groq"
    base-url: "https://api.groq.com/openai/v1"
    api-key-entries:
      - api-key: "gsk_..."
    models:
      - name: "openai/gpt-oss-20b"
        alias: "groq:gpt-oss-20b"
  - name: "alibaba"
    prefix: "alibaba"
    base-url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
    models-url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1/models"
    api-key-entries:
      - api-key: "sk-..."
    models:
      - name: "glm-5.2"
        alias: "ail-compound-alibaba"
        expose: false
        visibility: private
        capabilities: {operations: [chat, chat_text_tools, chat_multiturn_tools], input: [text], output: [text], tools: true, tool_history_replay: true, agentic_safe: true, context: 1000000}
      - name: "glm-5.2"
        alias: "alibaba:glm-5.2"
        expose: false
        visibility: private
        capabilities: {operations: [chat, chat_text_tools, chat_multiturn_tools], input: [text], output: [text], tools: true, tool_history_replay: true, agentic_safe: true, context: 1000000}
      - name: "qwen3.7-max"
        alias: "alibaba:qwen3.7-max"
        expose: false
        visibility: private
        capabilities: {operations: [chat, chat_text_tools], input: [text], output: [text], tools: true, context: 1000000}
      - name: "MiniMax-M2.5"
        alias: "alibaba:MiniMax-M2.5"
      - name: "glm-5"
        alias: "alibaba:glm-5"
      - name: "kimi-k2.5"
        alias: "alibaba:kimi-k2.5"
  - name: "xiaomi"
    prefix: "xiaomi"
    base-url: "https://api.xiaomimimo.com/v1"
    models-url: "https://api.xiaomimimo.com/v1/models"
    api-key-entries:
      - api-key: "sk-..."
    models:
      - name: "mimo-v2-pro"
        alias: "xiaomi:mimo-v2-pro"
      - name: "mimo-v2-omni"
        alias: "xiaomi:mimo-v2-omni"
      - name: "mimo-v2-flash"
        alias: "xiaomi:mimo-v2-flash"
      - name: "mimo-v2-tts"
        alias: "xiaomi:mimo-v2-tts"

  # MiniMax — chat, image generation, and TTS.
  #
  # Chat (MiniMax-M3) supports built-in web_search via tools field — see
  # docs/user/api-reference.md §Web Search.
  #
  # TTS (speech-2.8-hd) is served through the MiniMax T2A adapter
  # (internal/runtime/executor/minimax_tts.go). When a request hits
  # /v1/audio/speech with a minimax model, the adapter translates the
  # OpenAI-shape or MiniMax-native request to MiniMax's native /v1/t2a_v2
  # schema and resolves the returned hex/url audio to raw bytes. Use MiniMax
  # voice IDs (e.g. English_expressive_narrator), not OpenAI voice names.
  #
  # Plan caveats: the Plus token plan has a very restrictive RPM (~1–5 req/min)
  # on TTS. MiniMax's 1002 error is translated to HTTP 429 so the failover
  # taxonomy classifies it as ClassRateLimit (advance-eligible).
  - name: "minimax"
    prefix: "minimax"
    base-url: "https://api.minimax.io/v1"
    api-key-entries:
      - api-key: "sk-..."
    models:
      - name: "MiniMax-M3"
        alias: "ail-compound-minimax"
        expose: false
        visibility: private
        capabilities:
          operations:
            - chat
            - chat_text_tools
            - chat_multiturn_tools
            - chat_image_understanding
          input:
            - text
            - image
          output:
            - text
          tools: true
        # Provider-native tools advertised to agentic callers via the
        # /v1/models discovery endpoint. Agent runtimes (OpenClaw,
        # Hermes, custom SDKs) splice these entries into their own
        # caller tools[] so the model picks them on recent-events /
        # browsing queries without relying on server-side autoinject.
        native_tools:
          - type: "web_search"
            description: "MiniMax native web search. Autonomous by default; set force_search:true to force when the question is clearly recent-events."
            params:
              force_search: { type: "boolean", default: false }
              max_keyword:  { type: "integer", default: 3 }
              limit:        { type: "integer", default: 3 }
      # Hidden compatibility aliases: stale clients that still send raw
      # provider IDs keep routing, while /v1/models exposes only stable ail-*.
      # The M2.7 alias intentionally routes to M3 so already-open shells do not
      # break during rollout.
      - name: "MiniMax-M3"
        alias: "minimax:MiniMax-M2.7"
        expose: false
        visibility: private
        capabilities:
          operations:
            - chat
            - chat_text_tools
            - chat_multiturn_tools
            - chat_image_understanding
          input:
            - text
            - image
          output:
            - text
          tools: true
      - name: "MiniMax-M3"
        alias: "minimax:MiniMax-M3"
        expose: false
        visibility: private
        capabilities:
          operations:
            - chat
            - chat_text_tools
            - chat_multiturn_tools
            - chat_image_understanding
          input:
            - text
            - image
          output:
            - text
          tools: true
      - name: "image-01"
        alias: "minimax:image-01"
        expose: false
        visibility: private
      - name: "image-01"
        alias: "ail-image"
      - name: "speech-02-hd"
        alias: "minimax:speech-02-hd"
        expose: false
        visibility: private
      - name: "speech-2.8-hd"
        alias: "minimax:speech-2.8-hd"
        expose: false
        visibility: private
      - name: "speech-2.8-hd"
        alias: "ail-speech"
      # music-2.6: text-to-music (Plus plan, 100 songs/day). Served via
      # POST /v1/music/generations → MiniMax music adapter (minimax_music.go).
      - name: "music-2.6"
        alias: "minimax:music-2.6"
        expose: false
        visibility: private
      - name: "music-2.6"
        alias: "ail-music"
      # music-cover: reference-audio style transfer (Plus plan, 100/day).
      # Same upstream endpoint as music-2.6 — model field switches mode.
      - name: "music-cover"
        alias: "minimax:music-cover"
        expose: false
        visibility: private
      - name: "music-cover"
        alias: "ail-music-cover"

  # Kimi K2.6 — mutual failover pair with MiniMax. See docs/fallback-strategy.md.
  #
  # Kimi K2.6 supports 256k context and coding-modal input. Used as backup
  # for MiniMax in all intent categories (and vice versa). Both providers
  # ride the circuit breaker so 3 consecutive failures on one routes to the
  # other for 5 minutes before the probe retry.
  - name: "kimi"
    prefix: "kimi"
    base-url: "https://api.kimi.com/coding/v1"
    models-url: "https://api.kimi.com/coding/v1/models"
    headers:
      User-Agent: "switchAILocal/v0.5"
    api-key-entries:
      - api-key: "sk-kimi-..."
    models:
      - name: "kimi-k2.6"
        alias: "kimi:kimi-k2.6"
        context_length: 256000


  # DeepSeek — text-only long-context member for ail-compound and direct ail-fast.
  - name: "deepseek"
    prefix: "deepseek"
    base-url: "https://api.deepseek.com/v1"
    models-url: "https://api.deepseek.com/v1/models"
    api-key-entries:
      - api-key: "sk-deepseek-..."
    models:
      - name: "deepseek-v4-pro"
        alias: "ail-fast"
        context_length: 1000000
        capabilities: {operations: [chat, chat_text_tools], input: [text], output: [text], tools: true, context: 1000000}
      # Private direct alias used by deployment templates and diagnostics.
      - name: "deepseek-v4-pro"
        alias: "ail-compound-deepseek"
        expose: false
        visibility: private
        context_length: 1000000
        capabilities: {operations: [chat, chat_text_tools], input: [text], output: [text], tools: true, context: 1000000}
      - name: "deepseek-v4-flash"
        alias: "ail-fast-flash"
        expose: false
        visibility: private
        context_length: 1000000
        capabilities: {operations: [chat, chat_text_tools], input: [text], output: [text], tools: true, context: 1000000}

# -- VERTEX COMPATIBILITY --
# For third-party providers using Vertex-style protocols
# vertex-api-key:
#   - api-key: "vk-..."
#     base-url: "https://api.example.com"

# =============================================================================
# 6. INTELLIGENT ROUTING (CORTEX PHASE 2)
# =============================================================================

# Intelligence is the core of Cortex Router. It manages classification,
# semantic matching, and dynamic model allocation.
intelligence:
  # Master switch for all intelligence features.
  enabled: true

  # Primary model used for request classification.
  router-model: "ollama:gpt-oss:20b-cloud"
  # Fallback model if the primary router model fails.
  router-fallback: "openai:gpt-4o-mini"

  # Static intent-to-model mapping matrix.
  #
  # Chat intents (auto/coding/reasoning/fast/creative/secure/research/chat/cli/
  # long_ctx/long_context) route the /v1/chat/completions request to the listed
  # model. Specialized slots (image_gen, transcription, speech, embedding,
  # web_search) are used by their dedicated endpoints — see below.
  matrix:
    coding: "ail-compound"
    reasoning: "ail-compound"
    fast: "ail-compound"
    secure: "ail-compound"
    vision: "ail-vision"
    audio: "ail-compound"
    embedding: "ail-embed"
    image_gen: "ail-image"
    transcription: "ail-transcribe"
    speech: "ail-speech"
    web_search: "ail-search"
    music_generation: "ail-music"
    music_cover: "ail-music-cover"
    lyrics_generation: "ail-music"

  # -- PHASE 2 FEATURES --

  # Automated model discovery across all providers.
  discovery:
    enabled: true
    refresh-interval: 3600 # seconds
    cache-dir: "~/.switchailocal/cache/discovery"

  # Local embedding engine for semantic features.
  # REQUIRES: libonnxruntime and model download via scripts/download-embedding-model.sh
  embedding:
    enabled: true
    model: "all-MiniLM-L6-v2"

  # Semantic matching bypassing LLM classification for speed.
  semantic-tier:
    enabled: true
    confidence-threshold: 0.85

  # Skill-based prompt augmentation.
  skills:
    enabled: true
    directory: "plugins/cortex-router/skills"

  skill-matching:
    enabled: true
    confidence-threshold: 0.80

  # Semantic Cache for high-speed routing of repeated queries.
  semantic-cache:
    enabled: true
    similarity-threshold: 0.95
    max-size: 10000

  # Confidence scoring for classifications.
  confidence:
    enabled: true

  # Cross-verification of classifications.
  verification:
    enabled: true
    confidence-threshold-low: 0.60
    confidence-threshold-high: 0.90

  # Automatic model cascading based on response quality.
  cascade:
    enabled: true
    quality-threshold: 0.70

  # Feedback collection and metrics.
  feedback:
    enabled: true
    retention-days: 90

# =============================================================================
# 7. SUPERBRAIN (AUTONOMOUS SELF-HEALING)
# =============================================================================

# Transforms switchAILocal into an autonomous gateway with monitoring,
# failure diagnosis, and automatic recovery.
superbrain:
  # Master switch
  enabled: false

  # Operational mode:
  #   - "disabled": Off
  #   - "observe": Monitor only
  #   - "diagnose": Propose actions but don't execute
  #   - "human-in-the-loop": Request approval
  #   - "conservative": Auto-execute safe actions
  #   - "autopilot": Full autonomous recovery
  mode: "disabled"

  component_flags:
    overwatch_enabled: true # Real-time monitoring
    doctor_enabled: true # AI failure diagnosis
    injector_enabled: true # Autonomous stdin response
    recovery_enabled: true # Process restart with corrective flags
    fallback_enabled: true # Intelligent failover
    sculptor_enabled: true # Context optimization

  overwatch:
    silence_threshold_ms: 30000
    log_buffer_size: 50
    heartbeat_interval_ms: 1000
    max_restart_attempts: 2

  doctor:
    model: "gemini-flash"
    timeout_ms: 5000

  stdin_injection:
    mode: "conservative"

  context_sculptor:
    enabled: true
    token_estimator: "tiktoken" # tiktoken or simple
    priority_files: ["README.md", "main.go"]

  fallback:
    enabled: true
    providers: ["kimi", "deepseek", "geminicli"]
    min_success_rate: 0.5

# =============================================================================
# 8. ADVANCED PAYLOAD INJECTION
# =============================================================================

# Apply default or override parameters to model payloads globally.
# For agent pools, force thinking on for active compound backends. Alibaba GLM uses
# OpenAI-compatible `enable_thinking`; MiniMax-M3 uses `thinking.type=adaptive`.
payload:
  default: []
  override:
    - models:
        - name: "glm-5.2"
          protocol: "openai"
        - name: "alibaba:glm-5.2"
          protocol: "openai"
        - name: "ail-compound-alibaba"
          protocol: "openai"
      params:
        "enable_thinking": true
    - models:
        - name: "MiniMax-M3"
          protocol: "openai"
        - name: "ail-compound-minimax"
          protocol: "openai"
        - name: "minimax:MiniMax-M3"
          protocol: "openai"
      params:
        "thinking.type": "adaptive"

# =============================================================================
# 9. PROVIDER-SPECIFIC EXCLUSIONS
# =============================================================================

# Global model exclusions per provider.
# oauth-excluded-models:
#   geminicli:
#     - "*-preview"
#   ollama:
#     - "llama2"

# =============================================================================
# 10. BILLBOARD (SHARED WORKING DIRECTORY)
# =============================================================================

# When enabled, CLI provider requests (geminicli) receive a system prompt instructing
# the model to use this shared folder for file operations when no specific path is given.
billboard:
  enabled: false
  base-dir: "~/.switchailocal/billboard"

# =============================================================================
# 11. OBSERVABILITY (LOGGING, METRICS & EVENTS)
# =============================================================================

# Controls how switchAILocal outputs logs, metrics, and request events.
# These settings enable integration with external monitoring stacks
# (Grafana Loki, ELK, Prometheus, Datadog, etc.)
observability:
  # Log output format:
  #   - "text": Human-readable colored output (default, best for terminal use)
  #   - "json": Structured JSON output (required for Loki, ELK, Datadog, Kubernetes)
  log-format: "text"

  # Prometheus metrics endpoint configuration.
  metrics:
    enabled: true
    path: "/metrics" # HTTP path served on the main server port

  # Structured per-request event logging (NDJSON format).
  # Each proxied request emits a JSON event with model, provider, latency,
  # token counts, RQS score, fallback chain, and routing decision metadata.
  request-events:
    enabled: false
    output: "stdout"              # "stdout" or "file"
    file-path: "logs/events.ndjson"
    include-body: false           # WARNING: enabling this produces very large logs

# ============================================================================
# NOTIFICATIONS — outbound relays for sandboxed clients
# ============================================================================
# When enabled, the gateway exposes /v1/notifications/<channel>/<action>
# endpoints that forward messages to external services (Telegram today, more
# channels later). Use case: agents inside network-isolated Tytus pods that
# need to message a human but cannot reach the public internet directly. The
# gateway holds the upstream credentials server-side so a compromised pod
# never sees a real bot token.
notifications:
  telegram:
    # Master switch. The endpoint returns 503 when false or when bots is empty.
    enabled: false

    # Named bots the gateway can relay through. Callers select a bot by name
    # (default = "default" if omitted). Tokens are server-side only — never
    # echoed in responses or logs. allowed-chat-ids optionally restricts which
    # chat_ids each bot will message; empty = any chat_id permitted.
    bots: []
    # Example:
    # bots:
    #   - name: "default"
    #     token: "${TELEGRAM_BOT_TOKEN}"
    #     allowed-chat-ids: [746496145]   # optional allowlist
    #   - name: "alerts"
    #     token: "${TELEGRAM_ALERTS_TOKEN}"
